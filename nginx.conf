server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the raw captures with the right type so browsers offer to save
    # them (and Wireshark opens them) instead of rendering binary junk.
    location /pcaps/ {
        types { application/vnd.tcpdump.pcap pcap; }
        default_type application/vnd.tcpdump.pcap;
        add_header Content-Disposition 'attachment' always;
        add_header Cache-Control 'no-cache' always;
    }

    # Written every few seconds by neigh.sh: the host's neighbour table and cards.
    location = /neighbors.json {
        default_type application/json;
        add_header Cache-Control 'no-store' always;
    }

    # Lets the MAC page find the visitor in that neighbour table.
    location = /whoami {
        default_type application/json;
        add_header Cache-Control 'no-store' always;
        return 200 '{"ip":"$remote_addr"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
